databaseName: db_main
# 真实数据源
dataSources:
  db_1:
    driverClassName: com.mysql.cj.jdbc.Driver
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/admin?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&rewriteBatchedStatements=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC
    username: root
    password: 123

  db_2:
    driverClassName: com.mysql.cj.jdbc.Driver
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/admin?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&rewriteBatchedStatements=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC
    username: root
    password: 123

rules:
  # 读写分离
  - !READWRITE_SPLITTING
    dataSourceGroups:
      readwrite_ds:
        writeDataSourceName: db_1
        readDataSourceNames:
          - db_1
          - db_2
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: random
    loadBalancers:
      random:
        type: RANDOM

      # 广播
      #  - !BROADCAST
      #    tables:
      #      - player_info
      #      - server_info
      #      - sys_user
      #      - user_account

  - !SINGLE
    tables:
      #      - readwrite_ds.server_info # 加载指定单表
      - readwrite_ds.* # 加载指定数据源中的全部单表
    #      - "*.*" # 加载全部单表
    defaultDataSource: readwrite_ds # 默认数据源(在rules -> dataSourceGroups中定义的)，仅在执行 CREATE TABLE 创建单表时有效。缺失值为空，表示随机单播路由。


props:
  sql-show: true
  sql-simple: true
