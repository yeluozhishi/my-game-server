server:
  port: ${game.data.port}  # web服务的端口


spring:
  application:
    name: game-gateway

  profiles:
    active: script-gate

  cloud:
    bus:
      enabled: false
  kafka:
    bootstrap-servers: 172.21.166.3:9092
    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

# 服务注册与发现
eureka:
  client:
    register-with-eureka: true #向Eureka注册自己
    fetch-registry: true #检索服务项
    service-url:
      defaultZone: http://127.0.0.1:5010/eureka  #客户端与服务端交互地址，多个逗号隔开

  instance:
    prefer-ip-address: false #将自己的ip注册到Eureka服务中
    instance-id: ${spring.application.name}-${game.data.zone}-${game.data.server} #实例id
    metadata-map:
      id: ${game.data.server}
      zone: ${game.data.zone}

game:
  data:
    boss-thread-count: 5
    work-thread-count: 10
    port: 6000
    server: 100
    zone: 1
    dev: true
    script-path: C:\WorkSpace\temp\game\core\script-gate-1.0-SNAPSHOT.jar
    config-path: D:\GitHubRepository\my-game-server\config\src\main\config\zh_CN\


  kafka-topic:
    group-id: 1
    message-topic: "message"
    rpc-request-message-topic: "rpc-request-message"
    rpc-response-message-topic: "rpc-response-message"
