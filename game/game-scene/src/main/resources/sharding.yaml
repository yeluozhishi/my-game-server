databaseName: db_main
# 真实数据源
dataSources:
  db0:
    driver-class-name: com.mysql.cj.jdbc.Driver
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/game-scene?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&rewriteBatchedStatements=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT
    username: root
    password:

  db1:
    driver-class-name: com.mysql.cj.jdbc.Driver
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/game-scene?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&rewriteBatchedStatements=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT
    username: root
    password:

rules:
  - !SINGLE
    tables:
      # - readwrite_ds.t_single # 加载指定单表
      - readwrite_ds.* # 加载指定数据源中的全部单表
    #      - "*.*" # 加载全部单表
    defaultDataSource: readwrite_ds # 默认数据源（在rules -> dataSourceGroups中定义的），仅在执行 CREATE TABLE 创建单表时有效。缺失值为空，表示随机单播路由。


  - !READWRITE_SPLITTING
    dataSourceGroups:
      readwrite_ds:
        writeDataSourceName: db0
        readDataSourceNames: [ db0,db1 ]
        transactionalReadQueryStrategy: DYNAMIC
        loadBalancerName: round_robin

    loadBalancers:
      round_robin:
        type: ROUND_ROBIN


props:
  sql-show: true
  sql-simple: true